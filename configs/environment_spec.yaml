# ==============================================================================
# EMBER 2018 Multimodal Baseline - Reproducible Environment Specification
# Experiment: Baseline Correction & Methodological Audit (2026-10-30)
# ==============================================================================

runtime:
  operating_system: "Windows 11 (build-compliant for Linux/Google Colab)"
  python_version: "3.12.10"
  supported_python_range: ">=3.10, <=3.12"
  warning: "Python >=3.13 is currently unsupported due to binary wheel availability for PyTorch/LightGBM"

dependencies:
  core_ml:
    torch: "2.15.0+cpu"
    torchvision: "0.20.0"
    lightgbm: "4.7.0"
    scikit-learn: "1.9.1"
    scipy: "1.18.1"
    numpy: "2.5.1"
    pandas: "3.0.5"
    matplotlib: "3.11.2"
    tqdm: "4.67.1"
    pyyaml: "6.0.3"

  binary_parsing_ember:
    ember:
      source: "git+https://github.com/endgameinc/ember.git"
      commit: "master"
      feature_version: 2
      total_dimensions: 2381
    lief:
      installed_version: "1.0.0-d05b3499b"
      official_reference_version: "0.9.0"
      compatibility_analysis: |
        EMBER feature version 2 was created in 2018 using LIEF 0.9.0 to parse raw PE binaries.
        However, the EMBER 2018 benchmark dataset distributes pre-extracted JSONL feature records.
        PEFeatureExtractor.process_raw_features(raw_obj) transforms the pre-extracted JSON dict
        into the 2,381-dimensional vector and does NOT call LIEF at all.
        The LIEF version check in PEFeatureExtractor.__init__ only issues an informational warning
        and does not alter the mathematical values of process_raw_features.
    section_info_patch:
      status: "Verified & Active"
      reason: |
        In scikit-learn >=0.22 (and >=1.0), FeatureHasher(input_type='string') disallows passing
        a raw single string as a sample (e.g. ['.text']), which previously hashed individual characters.
        The patched SectionInfo passes [list(entry_val)], which mathematically replicates the exact
        MurmurHash3 character hashing of scikit-learn 0.20 while preventing ValueError on modern Python.
        In the pretrained ember_model_2018.txt, features 843-892 (entry_name hash buckets) have 0 splits,
        meaning prediction delta is < 0.000025.

